name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pinned deliberately. `pip install ruff` installs whatever is newest,
      # and ruff adds rules in minor releases — so an unpinned lint job can
      # turn red on a commit that changed nothing. Bump this on purpose.
      - name: Install lint tools
        run: pip install ruff==0.14.14
      - name: Run ruff
        run: ruff check .
